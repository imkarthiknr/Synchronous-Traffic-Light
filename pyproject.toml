[project]
name = "junctioniq"
version = "0.1.0"
description = "Traffic signal control for the Kowdenahalli junctions: vehicle queues from video, SUMO simulation and a Double DQN agent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Karthik N R", email = "karthik.elearning@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "eclipse-sumo>=1.24",
    "libsumo>=1.24",
    "traci>=1.24",
    "sumolib>=1.24",
    "gymnasium>=1.0",
    "numpy>=1.26",
    "torch>=2.4",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
vision = [
    "onnxruntime>=1.18",
    "supervision>=0.25,<0.31",
    "opencv-python-headless>=4.9",
]

[project.scripts]
junctioniq = "junctioniq.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "onnxruntime>=1.18", "supervision>=0.25,<0.31", "opencv-python-headless>=4.9"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/junctioniq"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not model'"
markers = [
    "slow: longer simulation runs",
    "model: needs the YOLOX model download",
]
